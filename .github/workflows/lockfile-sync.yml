name: lockfile-sync

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: lockfile-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: sync bun.lock
    permissions:
      contents: write
    # Dependabot cannot update bun.lock. Refreshing it on the PR branch keeps
    # the merge commit self-consistent, so main never carries a stale lockfile
    # that would break the frozen installs in publish and pages.
    if: github.event_name == 'push' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          # A GITHUB_TOKEN push cannot trigger workflows, which would leave the
          # rewritten PR head with no checks. Falls back to GITHUB_TOKEN when
          # the dependabot secret is absent: the lockfile is still corrected,
          # only the re-run is lost.
          token: ${{ secrets.DEPENDABOT_LOCKFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set Up Bun Package Manager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # This job holds a write-capable token, so it must not execute package
      # lifecycle scripts from the branch it is resolving. Skipping them
      # produces a byte-identical lockfile.
      - name: Resolve Dependencies
        run: bun install --ignore-scripts

      - name: Commit Lockfile Drift
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is in sync"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          # On a PR the whole point is to re-run checks against the rewritten
          # head, and [skip ci] would suppress that. On main it stays, so the
          # backstop commit does not kick off a second publish.
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            git commit -m 'chore(deps): sync bun.lock'
          else
            git commit -m 'chore(deps): sync bun.lock [skip ci]'
          fi
          git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          git push
